# Publishes to npm when main receives a version that is not on the registry yet (a merge of
# developer with the version bumped in package.json and CHANGELOG.md). A merge that keeps the
# version publishes nothing. Then tags v<version> and creates the GitHub release.
#
# npm auth: trusted publishing (OIDC), no token. Each package (@nodebuilderjs/core,
# @nodebuilderjs/linux-x64, create-nodebuilderjs) has, on npmjs.com > Settings > Trusted
# publisher: GitHub Actions, repository felipebrgs1/nodebuilderjs, workflow publish.yml,
# environment npm.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Is this version new?
        run: |
          version=$(jq -r .version package.json)
          # A prerelease (0.5.0-beta.1) goes to the "next" dist-tag, never to "latest".
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          missing=false
          for name in @nodebuilderjs/linux-x64 @nodebuilderjs/core create-nodebuilderjs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2F}/$version")
            [ "$code" = 404 ] && missing=true
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" = true ]; then echo "Publishing $version (tag $tag)"; else echo "$version is already on npm: nothing to do"; fi

  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write # tag + release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the release goes through the API (gh), not git push

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Trusted publishing needs npm 11.5.1+ (Node 24 ships it). No registry-url: it writes an
      # .npmrc with a placeholder token (and always-auth) that OIDC does not use.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Builds the portable addon in the Ubuntu 22.04 container (cli/package/Dockerfile), as a
      # local release does, packs and publishes what is missing on the registry.
      - name: Build and publish
        run: bun run npm:publish --npm --tag "${{ needs.version.outputs.tag }}"

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 0; fi
          # The notes are this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          prerelease=""; case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md $prerelease
