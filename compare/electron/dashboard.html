<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fafafa; font-family: sans-serif; font-size: 14px; color: #1f1f24; }
  body { display: flex; user-select: none; }
  .muted { color: #6b6b76; }
  .b { font-weight: bold; }
  .row { display: flex; flex-direction: row; }
  .col { display: flex; flex-direction: column; }
  .grow { flex: 1; min-width: 0; }
  .center { align-items: center; }

  #side { width: 220px; padding: 16px 12px; gap: 4px; background: #f1f1f4; }
  #side .brand { font-size: 18px; font-weight: bold; padding: 0 12px 12px; }
  .nav { gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: #6b6b76; }
  .nav:hover { color: #1f1f24; }
  .nav.on { background: #3584e41f; color: #2a6fc4; font-weight: bold; }
  .dot { width: 10px; height: 10px; border-radius: 5px; flex: none; }
  .section { font-size: 11px; font-weight: bold; color: #6b6b76; padding: 0 12px; margin-top: 16px; }
  .region { padding: 6px 12px; font-size: 13px; }

  #main { padding: 16px 20px; gap: 12px; min-height: 0; }
  input[type=text] { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid #00000024; background: #fff; outline: none; }
  input[type=text]:focus { border: 2px solid #3584e4; padding: 8px 11px; }
  button { font: inherit; border: 0; padding: 8px 16px; border-radius: 8px; background: #00000010; color: #1f1f24; cursor: pointer; }
  button:hover { background: #0000001a; }
  button:active { background: #00000029; }
  button.primary { background: #3584e4; color: #fff; font-weight: bold; }
  button.primary:hover { background: #4a92ea; }
  button.danger { background: #e01b24; color: #fff; font-weight: bold; }
  label.check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  label.check input { width: 20px; height: 20px; margin: 0; accent-color: #3584e4; }

  .tabs { gap: 4px; }
  .tab { padding: 8px 12px 0; gap: 8px; cursor: pointer; color: #6b6b76; }
  .tab:hover { color: #3a3a44; }
  .tab .bar { height: 3px; border-radius: 2px; }
  .tab.on { color: #1f1f24; font-weight: bold; }
  .tab.on .bar { background: #3584e4; }
  .divider { height: 1px; background: #0000001a; flex: none; }

  .card { background: #fff; border: 1px solid #00000014; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .scroll { overflow-y: auto; min-height: 0; }
  #content { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .chart { flex: 1; gap: 4px; align-items: flex-end; min-height: 160px; }
  .chart > div { flex: 1; border-radius: 3px; }

  .th { padding: 8px 24px 8px 12px; gap: 12px; background: #00000006; font-size: 12px; font-weight: bold; color: #6b6b76; }
  .th .sortable { cursor: pointer; }
  .th .active { color: #3584e4; }
  .tr { padding: 8px 12px; gap: 12px; border-radius: 6px; align-items: center; }
  .tr:hover .name { font-weight: bold; }
  .w50 { width: 50px; flex: none; } .w80 { width: 80px; flex: none; } .w90 { width: 90px; flex: none; }
  .w110 { width: 110px; flex: none; } .w170 { width: 170px; flex: none; }
  .meter { width: 110px; height: 6px; border-radius: 3px; background: #0000000f; flex: none; }
  .meter > div { height: 6px; border-radius: 3px; }

  .log { background: #1e1e24; border-radius: 8px; padding: 10px 12px; gap: 2px; font-size: 12px; }
  .log .row { gap: 10px; }
  .seg { background: #00000010; border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { padding: 6px 14px; background: transparent; }
  .seg button.on { background: #fff; }
</style>
</head>
<body>
  <div id="side" class="col"></div>
  <div id="main" class="col grow"></div>
  <script src="dashboard.js"></script>
</body>
</html>
